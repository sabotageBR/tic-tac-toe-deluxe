<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tic Tac Toe Deluxe</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/ui/estilo.css">
<!-- californiagames.io: a PlataformaSDK, servida pelo portal na origem dos jogos (nao vai no build). -->
<script src="/sdk/v1/plataforma-sdk.js"></script>
</head>
<body data-orient="retrato">
<div id="carregando" role="status" aria-label="Tic Tac Toe Deluxe">
  <div class="logo">Tic Tac Toe Deluxe</div>
  <div class="grade"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
<canvas id="cFundo" class="camada"></canvas>
<canvas id="cTopo" class="camada"></canvas>
<div id="hud">
  <header id="topo">
    <div class="jogador j1" id="j1"><i class="ponto"></i><span class="nome" id="nome1"></span><b class="pts" id="pts1">0</b></div>
    <div class="meio"><div class="titulo" id="titulo">Tic Tac Toe <b>Deluxe</b></div><div class="vez" id="vez"></div></div>
    <div class="jogador j2" id="j2"><b class="pts" id="pts2">0</b><span class="nome" id="nome2"></span><i class="ponto"></i></div>
  </header>
  <main id="area"></main>
  <div id="meta"><div class="dica" id="dica"></div></div>
  <footer id="base">
    <div class="submodos" id="submodos"></div>
    <div class="acoes">
      <button class="btn" id="btnDois">1P</button>
      <button class="btn" id="btnReiniciar"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
      <button class="btn" id="btnSom"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>
    </div>
  </footer>
</div>
<div id="debug" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
